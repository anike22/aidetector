[auth.email]
enable_confirmations = false

[auth.phone]
enable_confirmations = false

[functions.plugin-auth]
enabled = true
verify_jwt = false
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/plugin-auth/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/plugin-auth/*.html" ]

[functions.register]
enabled = true
verify_jwt = false
entrypoint = "./functions/register/index.ts"

[functions.plagiarism-checker]
enabled = true
verify_jwt = false
entrypoint = "./functions/plagiarism-checker/index.ts"


# OAuth callback and cron use nonce/worker-token checks; admin actions verify the user JWT in the function.
[functions.admin-outreach]
verify_jwt = false

# Custom service/worker authentication in handler.
[functions.affiliate-onboarding]
verify_jwt = false

# Partner endpoint uses scoped opaque bearer keys, never Supabase user JWT.
[functions.partner-detector]
enabled = true
verify_jwt = false

[functions.partner-credentials]
enabled = true
verify_jwt = false
