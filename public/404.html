<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#111827">
  <title>Page Not Found | AIDetector.cx</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8fafc; color: #111827; }
    main { width: min(100%, 560px); padding: 48px 32px; text-align: center; background: #fff; border: 1px solid #e5e7eb; border-radius: 24px; box-shadow: 0 16px 48px rgba(15, 23, 42, .07); }
    .brand { margin: 0 0 32px; font-size: 15px; font-weight: 750; letter-spacing: -.02em; color: #2563eb; }
    .code { margin: 0 0 12px; color: #64748b; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(30px, 6vw, 42px); line-height: 1.12; letter-spacing: -.04em; }
    p { margin: 16px 0 28px; color: #64748b; line-height: 1.65; }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 22px; border-radius: 12px; background: #2563eb; color: #fff; font-weight: 650; text-decoration: none; }
    a:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <main>
    <p class="brand">AIDetector.cx</p>
    <p class="code">Error 404</p>
    <h1>Page not found</h1>
    <p>The page you requested may have moved, been unpublished, or never existed. Check the address or return to the homepage.</p>
    <a href="/">Return to homepage</a>
  </main>
</body>
</html>
