name: Apply plagiarism compatibility fix

on:
  push:
    branches:
      - fix/plagiarism-response-compatibility

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/plagiarism-response-compatibility
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Wire compatibility normalizer and UI guards
        run: |
          python3 - <<'PY'
          from pathlib import Path

          engine = Path('src/pages/detector/detectionEngine.ts')
          text = engine.read_text()
          import_line = "import { normalizePlagiarismResult } from '@/lib/plagiarism/normalizePlagiarismResult';\n"
          if import_line not in text:
              anchor = "import { executeRealImageForensics } from '@/lib/imageDetection/imageForensicEngine';\n"
              if anchor not in text:
                  raise SystemExit('Expected detectionEngine import anchor not found')
              text = text.replace(anchor, anchor + import_line, 1)
          old = "  return data as PlagiarismAnalysisResult;"
          new = "  return normalizePlagiarismResult(data);"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Expected plagiarism return boundary not found')
          engine.write_text(text)

          page = Path('src/pages/PlagiarismCheckerPage.tsx')
          text = page.read_text()
          text = text.replace("`Verified Paraphrase: ${result.paraphraseMatchScore}%`", "`Verified Paraphrase: ${result.paraphraseMatchScore ?? 0}%`")
          text = text.replace("['Verified Paraphrase', `${result.paraphraseMatchScore}%`]", "['Verified Paraphrase', `${result.paraphraseMatchScore ?? 0}%`]")
          page.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run compatibility regression test
        run: npx vitest run src/__tests__/plagiarismResponseCompatibility.test.ts

      - name: Build
        run: npm run build

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/detector/detectionEngine.ts src/pages/PlagiarismCheckerPage.tsx
          if git diff --cached --quiet; then
            echo "No patch changes required"
            exit 0
          fi
          git commit -m "fix: normalize plagiarism responses at API boundary"
          git push origin HEAD:fix/plagiarism-response-compatibility
