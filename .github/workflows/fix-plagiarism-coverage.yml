name: Repair plagiarism contrast and discovery

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply repairs
        run: node .github/scripts/apply-plagiarism-repair.cjs
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/PlagiarismCheckerPage.tsx supabase/functions/plagiarism-checker/index.ts
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(plagiarism): improve contrast and diversify source discovery"
          git push origin HEAD:master
