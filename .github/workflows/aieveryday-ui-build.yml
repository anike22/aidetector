name: AIEVERYDAY frontend-only production build
on:
  pull_request:
    paths:
      - 'src/pages/PartnerResultPage.tsx'
      - 'src/components/affiliate/PartnerApiControls.tsx'
      - 'src/pages/referrals/AffiliateDashboardPage.tsx'
      - 'src/routes.tsx'
      - '.github/workflows/aieveryday-ui-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsgo -p tsconfig.check.json
      - name: Verify production frontend build
        run: pnpm exec vite build
